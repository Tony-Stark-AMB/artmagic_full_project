{% extends 'products/base.html' %}
{% load static %}


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block css %}<link rel="stylesheet" href="{% static 'css/profile.css' %}">
    <style>
        .password-reset__content{
            flex: 1;
            /* min-height: 20vh; */
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 25vh;
        }

        .password-reset__form{
            display: flex;
            flex-direction: column;
            align-items: center;
            align-self: flex-start;
            justify-content: space-around;
            min-height: 10vh;
        }

        .password-reset__email-field{
            padding: 5px 0 5px 10px;
            border-radius: 8px;
            outline: none;
            border: 1px solid #ddd;
            margin: 20px 0;
            cursor: pointer;
        }

    </style>
    {% endblock %}

    <title>Profile</title>
</head>


{% block content %}
<div class="password-reset__content">
    <div class="container__extra__small">
        <div class="password-reset__form-wrap">
            <div class="password-reset__title">
                <h2>Відновлення паролю</h2>
            </div>
            <form method="post" class="password-reset__form">
                {% csrf_token %}
                <div class="error-messages"></div>
                <div>
                    <input class="password-reset__email-field" type="email" name="email" placeholder="Введіть ваш email" required>
                </div>
                <div>
                    <button class="password-reset__submit-btn btn btn-primary" type="submit">Відправити</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
