{% extends "./base.html" %}
{% load static %}
{% load mptt_tags %}
{% block head %}
    <title>Артмагія — {{title}}</title>
    <meta name="description" content="⭐️ Артсклад в Дніпрі⭐️ : Доставка художніх матеріалів по всій Україні! ✔️ Фарби, пензлі, підрамники, мольберти, товари для дизайну та хобі ✆ 0661494273">
{% endblock %}
{% block css %}
  <link rel="stylesheet" href="{% static 'css/catalog.css' %}">
  <link rel="stylesheet" href="{% static 'css/footer/about_us.css' %}">
  <link rel="stylesheet" href="{% static 'css/contacts.css' %}">
  <style>
    .contacts-page{
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .contact-method {
        width: 60%;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        margin-top: 10px;
        @media (max-width: 450px) {
          width: 100%;
        }
    }
    .contact-options {
        width: 100%;
        display: flex;
        justify-content: space-around;
        list-style-type: none;
        padding: 0;
        margin: 0;
    }
    .contact-option {
        margin-bottom: 10px; /* Отступ между пунктами */
    }
    .contact-option a {
        display: inline-block;
        padding: 8px 16px;
        background-color: #0d6efd;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        text-decoration: none;
    }
    .contact-option a:hover {
        background-color: #0d6efd;
    }
    .contacts-page-content{
      flex: 1;
      min-height: 57.5vh;
    }

</style>
{% endblock %}
{% block content %}
<main class="contacts-page-content">
  <div class="container__extra__small">
    <div class="contacts-page">
          <h3 class="contacts-page__title">{{title}}</h3>
          <p class="text-center">{{error_message}}</p>
          <div class="contact-method">
            <div class="contact-options">
                <div class="contact-option">
                  <a class="c6" href="/">Перейти на головну сторінку</a>
                </div>
            </div>
        </div>  
      </div>     
    </div>      
  </main>          
  {% endblock %}
{% block js %}
  <script src="{% static 'js/index/index.js' %}"></script>
  <script type="module" src="{% static 'js/index/index-carousel.js' %}"></script>
{% endblock %}
